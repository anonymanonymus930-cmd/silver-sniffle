<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>💘 Georgia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
    margin:0;
    height:100vh;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI', sans-serif;
    overflow:hidden;
}

.card{
    background:white;
    padding:50px;
    border-radius:35px;
    text-align:center;
    box-shadow:0 35px 70px rgba(0,0,0,.45);
    animation:pop .8s ease;
    max-width:500px;
}

@keyframes pop{
    from{transform:scale(.4);opacity:0}
    to{transform:scale(1);opacity:1}
}

h1{
    color:#ff2f92;
    margin-bottom:20px;
}

p{
    font-size:18px;
    line-height:1.6;
}
h1{
    color:#ff2f92;
    margin-bottom:20px;
    animation:pulseLove 1.5s infinite;
}

@keyframes pulseLove{
    0%{transform:scale(1)}
    50%{transform:scale(1.08)}
    100%{transform:scale(1)}
}

/* glow pe card */
.card{
    animation:pop .8s ease, glow 2s infinite alternate;
}

@keyframes glow{
    from{box-shadow:0 0 25px rgba(255,47,146,.4);}
    to{box-shadow:0 0 60px rgba(255,47,146,.8);}
}

/* inimioare care cad */
.falling-heart{
    position:fixed;
    top:-10px;
    font-size:22px;
    animation:fall linear forwards;
    pointer-events:none;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }
}
</style>
</head>
<body>

<div class="card">
    <h1>💖 TE IUBBEEEEESSSCCC 💖</h1>
    <p>
        S-a decis.<br><br>
        Acum ești oficial Valentine-ul meu.<br><br>
        Nu mai ai nicio scăpare 😌<br><br>
        Sper că ești pregătită pentru toată iubirea<br>
        și îmbrățișările pe care ți le-am pregătit!<br><br>
        &lt;3
    </p>
</div>
<script>
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "falling-heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
    heart.style.fontSize = (Math.random() * 20 + 15) + "px";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
}, 300);
</script>

</body>
</html>
